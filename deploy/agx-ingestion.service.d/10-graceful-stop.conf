# Do not let systemd truncate a live recording.
#
# The default KillMode=control-group SIGTERMs every process in the unit's
# cgroup, including the child ffmpeg recorders. ffmpeg on SIGTERM exits WITHOUT
# writing the moov atom, so a `systemctl restart` mid-game leaves every angle
# headerless ("moov atom not found") and unplayable.
#
# Measured cost of the default: 2026-08-21, a restart 7 minutes into a
# 57-minute game left all five angles unreadable and recording never resumed —
# ~50 minutes of that game never existed.
#
# mixed  = SIGTERM only the main process; the service's own handler
#          (_finalize_for_shutdown) then SIGINTs the recorders so they write
#          their headers. Children are only SIGKILLed if we blow the timeout.
# 120s   = enough for five 4K muxers to flush and finalize.
#
# Install:
#   sudo mkdir -p /etc/systemd/system/agx-ingestion.service.d
#   sudo cp deploy/agx-ingestion.service.d/10-graceful-stop.conf \
#           /etc/systemd/system/agx-ingestion.service.d/
#   sudo systemctl daemon-reload
[Service]
KillMode=mixed
KillSignal=SIGTERM
TimeoutStopSec=120
